# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
    release:
        types: [created]

jobs:
    # The same gate as CI, re-run here on purpose. A release is cut from a tag, and
    # nothing guarantees that tag points at a commit CI ever saw. `npm publish` is
    # irreversible — a version number cannot be reused once taken — so verify rather
    # than assume.
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test

    publish-npm:
        # Without this the publish would run regardless of the gate above.
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org/
            - run: npm ci
            # GitHub releases flagged "pre-release" publish to the `beta`
            # dist-tag so existing users on Manage Palette (which tracks
            # `latest`) don't auto-upgrade onto unproven builds. Stable
            # releases publish to `latest` as before.
            - run: npm publish ${{ github.event.release.prerelease && '--tag beta' || '' }}
              env:
                  NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

